name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned, so the OS image changes when we choose to, not when `ubuntu-latest` moves.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Licensing is a hard rule (CLAUDE.md): fail before anything else.
      - run: pnpm license:check
      - run: pnpm lint
      - run: pnpm exec vue-tsc --noEmit -p .nuxt/tsconfig.app.json
      - run: pnpm test
      - run: pnpm build
